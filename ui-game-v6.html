<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>博德之门 3 构筑模拟器｜轻量化 V6</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#080706;overflow:hidden}
    body{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#080706}
    .v6-loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;color:#eadfc9;background:#090806 url('./assets/fantasy-forest-v6.webp') center/cover no-repeat;transition:.28s ease}
    .v6-loader:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,4,.88),rgba(5,5,4,.52) 48%,rgba(5,5,4,.7)),linear-gradient(rgba(5,5,4,.25),rgba(5,5,4,.72))}
    .v6-loader.hidden{opacity:0;visibility:hidden}
    .v6-loader-inner{position:relative;text-align:center}
    .v6-loader-mark{width:56px;height:56px;margin:0 auto 18px;border:1px solid rgba(225,194,124,.76);transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 34px rgba(225,194,124,.14)}
    .v6-loader-mark span{transform:rotate(-45deg);font:18px Georgia,serif}
    .v6-loader p{margin:0;color:#baad97;font-size:12px;letter-spacing:.12em}
    .v6-error{position:relative;max-width:620px;padding:24px;border:1px solid rgba(211,104,96,.48);border-radius:12px;color:#ead8b6;background:rgba(20,16,14,.92);line-height:1.8}
  </style>
</head>
<body>
  <div class="v6-loader" id="v6Loader"><div class="v6-loader-inner"><div class="v6-loader-mark"><span>VI</span></div><p>正在载入轻量化构筑界面</p></div></div>
  <iframe id="appFrame" src="./index.html?ui=light-v6" title="博德之门 3 构筑模拟器 V6"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('appFrame');
      const loader = document.getElementById('v6Loader');
      const fail = (message) => {
        loader.innerHTML = `<div class="v6-error"><strong>V6 资源载入失败</strong><br>${message}<br>请确认本文件、index.html 与 assets 文件夹位于同一目录。</div>`;
      };
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) throw new Error('无法读取 index.html。请通过本地服务器或 GitHub Pages 访问。');
          const link = doc.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/ui-light-v6.css?v=6';
          link.dataset.uiLightV6 = 'true';
          doc.head.appendChild(link);
          const script = doc.createElement('script');
          script.src = './assets/ui-light-v6.js?v=6';
          script.defer = true;
          script.dataset.uiLightV6 = 'true';
          script.addEventListener('load', () => setTimeout(() => loader.classList.add('hidden'), 220));
          script.addEventListener('error', () => fail('未找到 assets/ui-light-v6.js。'));
          doc.body.appendChild(script);
        } catch (error) {
          fail(error.message || String(error));
        }
      });
    })();
  </script>
</body>
</html>
