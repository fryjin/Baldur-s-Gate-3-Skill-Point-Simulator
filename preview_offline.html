  {id:'cloak-protection',act:2,slot:'cloak',name:'防护斗篷',en:'Cloak of Protection',rarity:'稀有',source:'终焉光芒旅店 · 商人',icon:'披',summary:'护甲等级与豁免检定各 +1。',effects:{ac:1,save:1},tags:['护甲','豁免','泛用'],score:92},
  {id:'arcane-acuity-helm',act:2,slot:'head',name:'奥术敏锐头盔',en:'Helmet of Arcane Acuity',rarity:'非常稀有',source:'第二章探索',icon:'慧',summary:'武器命中后叠加奥术敏锐，提升法术攻击与 DC。',effects:{spellDC:2,spellAttack:2},tags:['法术DC','控制','核心'],score:98},
  {id:'yuan-ti',act:2,slot:'armor',name:'元提鳞甲',en:'Yuan-Ti Scale Mail',rarity:'非常稀有',source:'终焉光芒旅店 · 商人',icon:'鳞',summary:'允许完整敏捷加值的中甲，兼顾防御与先攻。',effects:{ac:3,initiative:1},tags:['护甲','敏捷','中甲'],score:94},

  {id:'birthright',act:3,slot:'head',name:'天赋权利',en:'Birthright',rarity:'非常稀有',source:'博德之门 · 商人',icon:'冠',summary:'魅力 +2，纯魅力施法构筑的直接提升。',effects:{cha:2,spellDC:1,spellAttack:1},tags:['魅力','法术DC','核心'],score:96},
  {id:'markoheshkir',act:3,slot:'main',name:'玛科赫什基',en:'Markoheshkir',rarity:'传奇',source:'拉玛吉斯高塔',icon:'杖',summary:'毕业级施法法杖，强化法术并提供元素向能力。',effects:{spellDC:1,spellAttack:1,spellDamage:3},tags:['施法','法术DC','毕业'],score:100},
  {id:'rhapsody',act:3,slot:'off',name:'狂想曲',en:'Rhapsody',rarity:'非常稀有',source:'第三章首领战利品',icon:'匕',summary:'通过击杀累积强化命中、伤害与法术效果。',effects:{spellDC:1,spellAttack:1,damage:3},tags:['叠层','法术','爆发'],score:96},
  {id:'armour-agility',act:3,slot:'armor',name:'敏捷护甲',en:'Armour of Agility',rarity:'非常稀有',source:'博德之门 · 商人',icon:'甲',summary:'极高防御中甲，完整吃敏捷加值。',effects:{ac:4,save:2},tags:['护甲','敏捷','毕业'],score:98},
  {id:'dead-shot',act:3,slot:'ranged',name:'致命一击',en:'The Dead Shot',rarity:'非常稀有',source:'博德之门 · 商人',icon:'弓',summary:'提升远程命中并进一步压低重击阈值。',effects:{crit:1,attack:2},tags:['重击','远程','命中'],score:95},
  {id:'legacy-masters',act:3,slot:'gloves',name:'大师遗产',en:'Legacy of the Masters',rarity:'非常稀有',source:'第三章商人',icon:'掌',summary:'稳定提高武器攻击与伤害。',effects:{attack:2,damage:2},tags:['武器','命中','伤害'],score:93},
  {id:'helldusk-boots',act:3,slot:'boots',name:'狱火暮光长靴',en:'Helldusk Boots',rarity:'非常稀有',source:'第三章任务',icon:'靴',summary:'强化机动与生存，适合终局高压战斗。',effects:{defense:2,initiative:1},tags:['机动','生存','终局'],score:91},
  {id:'amulet-health',act:3,slot:'amulet',name:'强健护符',en:'Amulet of Greater Health',rarity:'非常稀有',source:'希望宅邸',icon:'心',summary:'将体质提升到极高水平，显著提高生命与专注稳定性。',effects:{conFloor:23,hp:24,save:2},tags:['体质','生命','专注'],score:100}
];

const state={
  stage:'equipment',act:1,slot:'armor',query:'',detail:null,
  build:{
    name:'123',level:9,route:'术士 7 / 牧师 2',race:'人类',background:'侍僧',
    stats:{hp:40,ac:13,initiative:6,spellDC:15,spellAttack:7,damage:0,crit:20},
    resources:['法术位 1环4 · 2环3 · 3环3 · 4环1 · 5环1','术法点 7','神力引导 1'],
    feats:['警觉'],skills:['奥秘','游说','洞悉','宗教'],spells:['酸液飞溅','灼热射线','火球术','法术反制','加速术'],
  },
  loadout:{head:null,cloak:null,armor:null,gloves:null,boots:null,amulet:null,ring1:null,ring2:null,main:null,off:null,ranged:null},
  history:{1:{},2:{},3:{}}
};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const byId=id=>items.find(x=>x.id===id);
const slots=Object.keys(slotMeta);

function effectiveStats(){
  const base={...state.build.stats};
  const equipped=Object.values(state.loadout).map(byId).filter(Boolean);
  const out={...base};
  let dexFloor=0,conFloor=0,cha=0;
  for(const it of equipped){const e=it.effects||{};out.ac+=(e.ac||0);out.initiative+=(e.initiative||0);out.spellDC+=(e.spellDC||0);out.spellAttack+=(e.spellAttack||0);out.damage+=(e.damage||0)+(e.spellDamage||0);out.crit-=e.crit||0;out.hp+=(e.hp||0);dexFloor=Math.max(dexFloor,e.dexFloor||0);conFloor=Math.max(conFloor,e.conFloor||0);cha+=e.cha||0}
  return{...out,dexFloor,conFloor,cha};
}

function stageNav(){
  return `<aside class="v8-stage-nav">
    <div class="v8-brand"><span>VIII</span><div><b>博德之门 3</b><small>构筑规划器 · V8 Preview</small></div></div>
    <nav>
      ${navGroup('character','人物构筑','等级 · 职业 · 属性 · 技能 · 法术','已完成')}
      ${navGroup('equipment','装备构筑','第一章 · 第二章 · 第三章',state.stage==='equipment'?'进行中':'已完成')}
      ${navGroup('final','最终构筑','角色 · 装备 · 战斗结果',state.stage==='final'?'当前':'待完成')}
    </nav>
    <div class="v8-stage-help"><span>当前体验版</span><p>装备数据为 V8 信息架构与交互演示，后续可接真实完整装备库与图片。</p></div>
  </aside>`;
}
function navGroup(key,title,desc,status){const active=state.stage===key;return `<button class="v8-nav-group ${active?'active':''}" data-stage="${key}"><i>${key==='character'?'Ⅰ':key==='equipment'?'Ⅱ':'Ⅲ'}</i><div><b>${title}</b><small>${desc}</small></div><span>${status}</span></button>`}

function topbar(){return `<header class="v8-topbar"><div class="v8-build-mini"><b>${esc(state.build.name)}</b><span>${state.build.level}级 · ${esc(state.build.route)}</span></div><div class="v8-top-actions"><button data-action="character-sheet">角色纸</button><button data-action="reset">重置预览</button></div></header>`}

function characterStage(){
  const s=state.build.stats;
  return `<main class="v8-main character-overview-stage">
    <section class="v8-page-head"><span>PHASE I · CHARACTER</span><h1>人物构筑</h1><p>保留现有 V7 的职业、属性、技能、职业能力和法术规则；V8 只重新组织信息层级。</p></section>
    <section class="v8-character-hero"><div><span class="v8-level">${state.build.level}</span><small>等级</small></div><div><h2>${esc(state.build.name)}</h2><p>${esc(state.build.race)} · ${esc(state.build.route)}</p><span>${esc(state.build.background)}</span></div><div class="v8-stat-row">${stat('生命',s.hp)}${stat('护甲',s.ac)}${stat('先攻','+'+s.initiative)}${stat('法术 DC',s.spellDC)}</div></section>
    <div class="v8-character-grid">
      ${summaryCard('关键资源',state.build.resources)}
      ${summaryCard('专长与技能',[...state.build.feats,...state.build.skills])}
      ${summaryCard('核心法术',state.build.spells)}
      <section class="v8-summary-card v8-character-cta"><span>人物构筑已完成</span><h3>进入章节装备路线</h3><p>装备选择会实时影响最终护甲、先攻、法术 DC、命中和伤害摘要。</p><button class="primary" data-stage="equipment">开始配装</button></section>
    </div>
  </main>`
}
function stat(label,value){return `<div><span>${label}</span><b>${value}</b></div>`}
function summaryCard(title,items){return `<section class="v8-summary-card"><span>${title}</span><div class="v8-tag-list">${items.map(x=>`<b>${esc(x)}</b>`).join('')}</div></section>`}

function equipmentStage(){
  const filtered=items.filter(it=>it.act===state.act&&it.slot===state.slot&&(!state.query||`${it.name} ${it.en} ${it.tags.join(' ')}`.toLowerCase().includes(state.query.toLowerCase()))).sort((a,b)=>b.score-a.score);
  const current=byId(state.loadout[state.slot]);
  return `<main class="v8-main v8-equipment-stage">
    <section class="v8-page-head compact"><span>PHASE II · EQUIPMENT</span><h1>章节装备路线</h1><p>每一章都从当前配装继续升级，不需要重新从零选择。</p></section>
    <div class="v8-act-tabs">${[1,2,3].map(a=>`<button class="${state.act===a?'active':''}" data-act="${a}"><span>ACT ${a}</span><b>第${['一','二','三'][a-1]}章</b><small>${Object.keys(state.history[a]).length} 件记录</small></button>`).join('')}</div>
    <section class="v8-loadout-bar">
      <div class="v8-section-label"><span>当前装备</span><b>${Object.values(state.loadout).filter(Boolean).length}/${slots.length}</b></div>
      <div class="v8-slot-grid">${slots.map(slot=>slotButton(slot)).join('')}</div>
    </section>
    <section class="v8-gear-workspace">
      <div class="v8-gear-list-pane">
        <div class="v8-gear-toolbar"><div><span>当前槽位</span><b>${slotMeta[state.slot][0]}</b>${current?`<small>当前：${esc(current.name)}</small>`:'<small>尚未装备</small>'}</div><input type="search" placeholder="搜索本章装备" value="${esc(state.query)}" data-search></div>
        <div class="v8-candidate-list">${filtered.length?filtered.map(it=>gearCard(it,current)).join(''):`<div class="v8-empty"><b>本章暂无该槽位候选</b><p>可以切换其他槽位，或进入下一章。</p></div>`}</div>
      </div>
      <aside class="v8-compare-pane">${comparePanel(current)}</aside>
    </section>
  </main>`
}
function slotButton(slot){const item=byId(state.loadout[slot]),active=state.slot===slot;return `<button class="v8-slot ${active?'active':''} ${item?'filled':''}" data-slot="${slot}"><span>${item?item.icon:slotMeta[slot][1]}</span><div><b>${slotMeta[slot][0]}</b><small>${item?esc(item.name):'未装备'}</small></div></button>`}
function gearCard(it,current){const equipped=state.loadout[state.slot]===it.id;const delta=compareDelta(current,it);return `<article class="v8-gear-card ${equipped?'equipped':''}">
  <button class="v8-gear-main" data-detail="${it.id}"><span class="v8-item-icon rarity-${it.rarity==='传奇'?'legend':'rare'}">${it.icon}</span><div><div class="v8-gear-title"><b>${esc(it.name)}</b>${equipped?'<i>已装备</i>':''}</div><small>${esc(it.en)} · ${esc(it.rarity)}</small><p>${esc(it.summary)}</p><div class="v8-tag-list mini">${it.tags.slice(0,3).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div></button>
  <div class="v8-gear-side"><span class="v8-score">推荐 ${it.score}</span><div class="v8-delta">${delta||'定位不同'}</div><button class="${equipped?'secondary':'primary'}" data-equip="${it.id}">${equipped?'移除':'装备'}</button></div>
</article>`}
function compareDelta(current,next){if(!next)return'';const a=current?.effects||{},b=next.effects||{};const parts=[];for(const [k,label] of [['ac','AC'],['initiative','先攻'],['spellDC','DC'],['spellAttack','法攻'],['damage','伤害'],['spellDamage','法伤'],['crit','重击']]){const d=(b[k]||0)-(a[k]||0);if(d)parts.push(`${label} ${d>0?'+':''}${d}`)}return parts.slice(0,2).join(' · ')}
function comparePanel(current){const st=effectiveStats();const selected=byId(state.loadout[state.slot]);return `<div class="v8-compare-sticky">
  <div class="v8-section-label"><span>决策最终效果</span><b>实时</b></div>
  <div class="v8-current-slot"><span>${slotMeta[state.slot][0]}</span><b>${selected?esc(selected.name):'未装备'}</b><small>${selected?esc(selected.summary):'从左侧选择本章装备。'}</small></div>
  <div class="v8-stat-compare">${metric('护甲',st.ac,state.build.stats.ac)}${metric('先攻','+'+st.initiative,state.build.stats.initiative,'+')}${metric('法术 DC',st.spellDC,state.build.stats.spellDC)}${metric('法术攻击','+'+st.spellAttack,state.build.stats.spellAttack,'+')}${metric('附加输出',st.damage.toFixed(1),0)}${metric('重击阈值',st.crit,20,'',true)}</div>
  <div class="v8-route-progress"><span>章节路线</span>${[1,2,3].map(a=>`<div><b>第${['一','二','三'][a-1]}章</b><small>${Object.keys(state.history[a]).length} 件装备记录</small></div>`).join('')}</div>
  <button class="primary wide" data-stage="final">查看最终构筑</button>
</div>`}
function metric(label,value,base,prefix='',lower=false){const num=parseFloat(String(value).replace('+',''));const delta=Number.isFinite(num)?num-base:0;const good=lower?delta<0:delta>0;return `<div><span>${label}</span><b>${value}</b><small class="${good?'up':delta?'down':''}">${delta?`${delta>0?'+':''}${delta} vs 人物基础`:'人物基础'}</small></div>`}

function finalStage(){const st=effectiveStats();const equipped=slots.map(s=>[s,byId(state.loadout[s])]).filter(([,it])=>it);return `<main class="v8-main v8-final-stage">
  <section class="v8-page-head"><span>PHASE III · FINAL BUILD</span><h1>最终构筑</h1><p>把人物成长、职业资源、法术与章节装备汇总在同一张构筑纸中。</p></section>
  <section class="v8-final-hero"><div class="v8-final-identity"><span class="v8-level">${state.build.level}</span><div><h2>${esc(state.build.name)}</h2><p>${esc(state.build.race)} · ${esc(state.build.route)}</p><small>人物 + 装备一体化构筑</small></div></div><div class="v8-stat-row large">${stat('生命',st.hp)}${stat('护甲',st.ac)}${stat('先攻','+'+st.initiative)}${stat('法术 DC',st.spellDC)}${stat('法术攻击','+'+st.spellAttack)}${stat('重击',st.crit)}</div></section>
  <div class="v8-final-grid">
    <section class="v8-summary-card wide"><div class="v8-section-label"><span>最终装备</span><b>${equipped.length}/${slots.length}</b></div><div class="v8-final-loadout">${slots.map(s=>{const it=byId(state.loadout[s]);return `<div class="${it?'filled':''}"><span>${it?it.icon:slotMeta[s][1]}</span><div><small>${slotMeta[s][0]}</small><b>${it?esc(it.name):'未装备'}</b>${it?`<em>第 ${it.act} 章</em>`:''}</div></div>`}).join('')}</div></section>
    ${summaryCard('职业与施法资源',state.build.resources)}
    ${summaryCard('核心法术',state.build.spells)}
    <section class="v8-summary-card"><span>装备路线</span><div class="v8-act-route">${[1,2,3].map(a=>`<div><b>第${['一','二','三'][a-1]}章</b><p>${Object.entries(state.history[a]).map(([slot,id])=>byId(id)?.name).filter(Boolean).join('、')||'尚未记录'}</p></div>`).join('')}</div></section>
    <section class="v8-summary-card"><span>构筑点评</span><h3>高先攻 · 高施法 DC · 章节渐进式升级</h3><p>当前原型将装备影响聚合为可读结果；下一阶段可以接真实伤害公式、套装协同、条件触发与装备冲突规则。</p></section>
  </div>
  <div class="v8-final-actions"><button data-stage="equipment">返回调整装备</button><button class="primary">保存此构筑</button></div>
</main>`}

function render(){
  document.getElementById('app').innerHTML=`<div class="v8-shell">${stageNav()}<div class="v8-content">${topbar()}${state.stage==='character'?characterStage():state.stage==='equipment'?equipmentStage():finalStage()}</div></div>`;
  bind();
}
function bind(){
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.stage=b.dataset.stage;render()});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{state.act=Number(b.dataset.act);render()});
  document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{state.slot=b.dataset.slot;render()});
  document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.equip,it=byId(id);if(state.loadout[it.slot]===id){state.loadout[it.slot]=null}else{state.loadout[it.slot]=id;state.history[it.act][it.slot]=id}render()});
  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openSheet(byId(b.dataset.detail)));
  const search=document.querySelector('[data-search]');if(search)search.oninput=()=>{state.query=search.value;render()};
  document.querySelector('[data-action="reset"]')?.addEventListener('click',()=>{Object.keys(state.loadout).forEach(k=>state.loadout[k]=null);state.history={1:{},2:{},3:{}};state.stage='equipment';state.act=1;state.slot='armor';render()});
  document.querySelector('[data-action="character-sheet"]')?.addEventListener('click',()=>{state.stage='final';render()});
}
function openSheet(it){const current=byId(state.loadout[it.slot]);document.getElementById('sheet-root').innerHTML=`<div class="v8-sheet-backdrop" data-close><section class="v8-sheet"><button class="v8-sheet-close" data-close>×</button><span class="v8-item-icon large">${it.icon}</span><div><span class="kicker">ACT ${it.act} · ${slotMeta[it.slot][0]}</span><h2>${esc(it.name)}</h2><small>${esc(it.en)} · ${esc(it.rarity)}</small><p>${esc(it.summary)}</p><dl><div><dt>获取</dt><dd>${esc(it.source)}</dd></div><div><dt>推荐定位</dt><dd>${it.tags.map(esc).join(' · ')}</dd></div><div><dt>与当前装备比较</dt><dd>${compareDelta(current,it)||'不同构筑定位，建议结合完整属性判断'}</dd></div></dl><button class="primary wide" data-sheet-equip="${it.id}">${state.loadout[it.slot]===it.id?'移除此装备':'装备并记录到第'+it.act+'章'}</button></div></section></div>`;document.querySelectorAll('[data-close]').forEach(x=>x.onclick=e=>{if(e.target===x)document.getElementById('sheet-root').innerHTML=''});document.querySelector('[data-sheet-equip]')?.addEventListener('click',()=>{if(state.loadout[it.slot]===it.id)state.loadout[it.slot]=null;else{state.loadout[it.slot]=it.id;state.history[it.act][it.slot]=it.id}document.getElementById('sheet-root').innerHTML='';render()})}

render();

</script>
</body>
</html>
